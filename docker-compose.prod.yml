# Docker Compose — produção no servidor físico local
# Uso: docker compose -f docker-compose.prod.yml up -d
#
# Diferente do docker-compose.yml (dev): usa a imagem já buildada pelo CI no GHCR
# em vez de buildar localmente. Porta publicada em todas as interfaces (0.0.0.0)
# — TESTE de acesso via IP da rede local (10.20.0.199:8080), sem exposição à
# internet. Ver [[project_migracao_servidor_local]] antes de expor além da LAN.
#
# Requisito: .env criado direto no servidor (nunca commitado). Credencial do
# Firebase vai via GOOGLE_CREDENTIALS_JSON dentro do .env (mesmo padrão já usado
# no Azure Container Apps — ver app/database.py) — não precisa de arquivo
# credentials.json montado.

services:
  # Fase 2 (Marco 12) — Postgres roda em LVM dedicado no HD de 1TB
  # (vg_data/lv_sistema_chamados_postgres, /mnt/data/sistema_chamados/postgres).
  # Repartição via LVM em 2026-08-05: SSD só com o SO, HDs em vg_data (dados)
  # e vg_backup (backup), reservando espaço pra outros projetos no mesmo
  # servidor (ver [[project_migracao_servidor_local]]). "web" depende deste
  # serviço estar saudável (depends_on abaixo) e se conecta via DATABASE_URL
  # no .env, pela
  # rede interna do compose (nome do serviço "postgres") — nunca precisa de
  # porta publicada na LAN.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sistema_chamados
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: sistema_chamados
    volumes:
      - /mnt/data/sistema_chamados/postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sistema_chamados -d sistema_chamados"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  web:
    image: ghcr.io/matheusth16/sistema-chamados-dtx:latest
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "0.0.0.0:8080:8080"
    env_file:
      - .env
    volumes:
      # Anexos novos (Fase 1 on-premise) — bind-mount pra LV dedicada em
      # vg_data (HD de 1TB), montada em /mnt/data/sistema_chamados/anexos.
      # Repartição via LVM em 2026-08-05 (ver [[project_migracao_servidor_local]]).
      # O caminho dentro do container deve bater com ANEXO_LOCAL_DIR no .env
      # do servidor. Dono já é 1001:1001 (appuser não-root do Dockerfile).
      - /mnt/data/sistema_chamados/anexos:/var/anexos_chamados
    healthcheck:
      # Envia X-Health-Token lendo HEALTH_SECRET do próprio ambiente do container
      # (env_file acima) — a rota /health exige o token quando HEALTH_SECRET está
      # configurado (ver app/routes/api_chamados.py). Sem HEALTH_SECRET, o header
      # vai vazio e a rota não exige autenticação (mesmo comportamento de antes).
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, urllib.request; req = urllib.request.Request('http://localhost:8080/health', headers={'X-Health-Token': os.environ.get('HEALTH_SECRET', '')}); urllib.request.urlopen(req)",
        ]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # Atualiza a imagem do "web" SOMENTE quando disparado manualmente via HTTP API
  # (sem polling automático) — barreira contra deploy automático a cada push:
  # o CI publica "latest" no GHCR normalmente, mas o container em produção só
  # troca quando alguém chama a API explicitamente.
  # Disparar com: bash scripts/watchtower_trigger.sh (rodar no servidor).
  # API exposta só em loopback (127.0.0.1) — não acessível pela LAN.
  #
  # Imagem: containrrr/watchtower foi arquivada (o cliente Docker embutido nela
  # só fala API v1.25, incompatível com Docker Engine mais recentes que exigem
  # v1.40+). Usamos o fork mantido nicholas-fedor/watchtower.
  watchtower:
    image: ghcr.io/nicholas-fedor/watchtower:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_HTTP_API_TOKEN: ${WATCHTOWER_HTTP_API_TOKEN}
    ports:
      - "127.0.0.1:8081:8080"
    command: --http-api-endpoints=update --cleanup sistema_chamados-web-1
    restart: unless-stopped
