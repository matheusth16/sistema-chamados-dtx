name: CD - Build & Push

# Publica a imagem no GHCR (ghcr.io/matheusth16/sistema-chamados-dtx:latest). O deploy em si
# não acontece aqui — produção roda no servidor físico on-premise (ver
# docker-compose.prod.yml) e é atualizada rodando scripts/watchtower_trigger.sh no servidor,
# que puxa a imagem nova via Watchtower. Deploy no Azure Container Apps foi removido em
# 2026-08-04 (Marco 12) — recurso parado desde 2026-07-31, produção não usa mais Azure.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build imagem Docker e publica no GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadados da imagem (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build e push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Segurança ──────────────────────────────────────────────────────────
      # Não-bloqueante: só reporta, não falha o deploy. Endurecer para bloqueante
      # depois de um período rodando e triando os achados.
      - name: Trivy — scan de vulnerabilidades na imagem
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"

      - name: Upload relatório Trivy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-report
          path: trivy-results.sarif
          retention-days: 30
