name: k6 Smoke Test

on:
  # Smoke semanal automatizado — toda segunda-feira às 08h BRT (11h UTC)
  schedule:
    - cron: "0 11 * * 1"
  # Trigger manual (dispatch) — rodar antes do go-live ou após deploy
  workflow_dispatch:
    inputs:
      base_url:
        description: "URL base do serviço (ex.: https://chamados.example.com)"
        required: true
        type: string
      test_type:
        description: "Tipo de teste"
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - stress
      confirm_production:
        description: "Confirmo conscientemente a execução contra alvo remoto"
        required: true
        default: false
        type: boolean

jobs:
  k6-test:
    # schedule não tem inputs — usa smoke por padrão
    name: ${{ inputs.test_type || 'smoke' }} test
    runs-on: ubuntu-latest
    env:
      # dispatch manual: usa inputs.base_url; schedule: usa secret PRODUCTION_URL
      BASE_URL: ${{ inputs.base_url || secrets.PRODUCTION_URL || '' }}
      # O schedule semanal é a confirmação explícita e revisável para produção.
      # No dispatch, o operador precisa marcar confirm_production.
      K6_CONFIRM_PROD: ${{ github.event_name == 'schedule' && '1' || (inputs.confirm_production && '1' || '0') }}
    steps:
      - uses: actions/checkout@v4

      - name: Verificar URL configurada
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "⚠️ BASE_URL não configurada — defina PRODUCTION_URL nos secrets do repositório ou passe base_url no dispatch."
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$K6_CONFIRM_PROD" != "1" ]; then
            echo "Alvo remoto bloqueado: marque confirm_production para autorizar a execução."
            exit 1
          fi
          echo "Testando: $BASE_URL"

      - name: Setup k6
        uses: grafana/setup-k6-action@v1.2.1

      - name: Run smoke test
        if: ${{ inputs.test_type != 'stress' }}
        run: |
          k6 run \
            -e "BASE_URL=$BASE_URL" \
            -e "K6_CONFIRM_PROD=$K6_CONFIRM_PROD" \
            --out json=k6-results.json \
            scripts/qa/k6/smoke.js

      - name: Run stress test
        if: inputs.test_type == 'stress'
        run: |
          k6 run \
            -e "BASE_URL=$BASE_URL" \
            -e "K6_CONFIRM_PROD=$K6_CONFIRM_PROD" \
            --out json=k6-results.json \
            scripts/qa/k6/stress.js

      - name: Upload k6 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-results-${{ inputs.test_type || 'smoke' }}-${{ github.run_id }}
          path: k6-results.json
          retention-days: 7
