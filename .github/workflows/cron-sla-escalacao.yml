name: Cron - SLA Escalonamento

# DESATIVADO (2026-08-04, Marco 12): existia pra acordar o Container App
# (min-replicas=0, free tier) a cada 10 min, já que o APScheduler in-process
# (app/__init__.py:_iniciar_scheduler) não era confiável em scale-to-zero —
# ver auditoria de CI/CD de 2026-07-21. Produção migrou pro servidor físico
# on-premise (sempre ligado, gunicorn --workers 1) em 2026-07-31; o
# APScheduler interno já cobre sla_escalacao a cada 10 min sozinho (confirmado
# rodando em produção). Além de redundante, o runner hospedado do GitHub
# Actions não alcança o servidor mesmo com PRODUCTION_URL corrigido — ele é
# LAN-only, sem domínio/VPN público. Mantido como workflow_dispatch manual
# (dry-run) caso o cenário de rede mude no futuro (self-hosted runner, VPN).

on:
  workflow_dispatch:

jobs:
  chamar-cron-sla-escalacao:
    name: Dispara job de escalonamento SLA via HTTP
    runs-on: ubuntu-latest
    steps:
      - name: Verificar secrets configurados
        run: |
          if [ -z "${{ secrets.PRODUCTION_URL }}" ] || [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "⚠️ PRODUCTION_URL ou CRON_SECRET não configurados nos secrets do repositório."
            exit 1
          fi

      - name: POST /internal/cron/sla-escalacao
        run: |
          status=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
            -X POST \
            -H "X-Cron-Token: ${{ secrets.CRON_SECRET }}" \
            --max-time 60 \
            "${{ secrets.PRODUCTION_URL }}/internal/cron/sla-escalacao")
          echo "HTTP status: $status"
          cat /tmp/resp.json
          if [ "$status" -ne 200 ]; then
            exit 1
          fi
